<!doctype html>
<html lang="he" dir="rtl" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח תפקידים</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f5cf6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tailwind.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js" onerror="document.getElementById('sbLoadErr').classList.remove('hidden')"></script>
<script>window._sbLoaded = typeof supabase !== 'undefined';</script>
<style>
  :root { --bg:#efeee9; --surface:#fff; --surface2:#e3e2dc; --text:#151515; --muted:#6b6b6b; --pill-muted:#5a5a5a; --line:#d6d5cf; --accent:#f5cf6b; --coral:#e8695a; --ink:#151515 }
  .dark { --bg:#1c1c1e; --surface:#2a2a2d; --surface2:#38383b; --text:#f4f4f2; --muted:#9a9a9a; --pill-muted:#b0b0b0; --line:#3d3d40 }
  body { font-family: 'Heebo', 'Arial Hebrew', sans-serif; background:var(--bg); color:var(--text) }
  .muted { color:var(--muted) }
  .surface2 { background:var(--surface2) }
  .input { width:100%; border-radius:999px; border:1.5px solid var(--line); background:transparent; padding:.7rem 1.1rem; font-size:.9rem; color:inherit; outline:none; transition:border-color .15s }
  .input:focus-visible { border-color:var(--text) }
  textarea.input { border-radius:1.25rem }
  .input option { color:#151515 }
  .label { display:block; font-size:.85rem; font-weight:600; margin-bottom:.4rem }
  .btn-primary { border-radius:999px; background:var(--ink); color:#fff; padding:.7rem 1.4rem; font-size:.9rem; font-weight:600; transition:opacity .2s,transform .15s }
  .dark .btn-primary { background:var(--accent); color:#151515 }
  .btn-primary:hover { opacity:.9 } .btn-primary:active { transform:scale(.97) } .btn-primary:disabled { opacity:.6 }
  .btn-ghost { border-radius:999px; padding:.6rem 1rem; font-size:.9rem; color:var(--muted); transition:background .18s }
  .btn-ghost:hover { background:var(--surface2) }
  .card { border-radius:1.75rem; background:var(--surface); transition:box-shadow .2s }
  .pill { border-radius:999px; padding:.5rem 1rem; font-size:.8rem; font-weight:500; background:var(--surface2); color:var(--pill-muted); white-space:nowrap; line-height:1.15; transition:background .2s,color .2s }
  .pill.on { background:var(--accent); color:#151515; font-weight:700 }
  .sheet { background:var(--coral); color:#151515 }
  .sheet .input { border-color:rgb(0 0 0 / .28); background:rgb(255 255 255 / .06) }
  .sheet .input:focus-visible { border-color:#151515 }
  .sheet .input::placeholder { color:rgb(0 0 0 / .6) }
  .sheet .btn-primary { background:#151515; color:#fff }
  .sheet .btn-ghost { color:rgb(0 0 0 / .65) } .sheet .btn-ghost:hover { background:rgb(0 0 0 / .08) }
  .no-sb { scrollbar-width:none } .no-sb::-webkit-scrollbar { display:none }
  dialog { color:var(--text) }
  dialog::backdrop { background: rgb(0 0 0 / .55); animation: fade-bd .22s ease both }
  @keyframes fade-bd { from { opacity:0 } to { opacity:1 } }
  dialog[open] { animation: slide-up .24s cubic-bezier(.32,1.1,.64,1) both }
  @keyframes slide-up { from { opacity:0; transform:translateY(16px) scale(.97) } to { opacity:1; transform:none } }
  /* Task dialog — bottom half-sheet */
  #taskDlg { position:fixed !important; bottom:0 !important; inset-inline:0 !important; margin:0 !important; width:100% !important; max-width:100% !important; border-radius:1.5rem 1.5rem 0 0 !important; max-height:55vh; overflow-y:auto; }
  #taskDlg[open] { animation: sheet-up .28s cubic-bezier(.32,1.1,.64,1) both }
  @keyframes sheet-up { from { transform:translateY(100%) } to { transform:translateY(0) } }
  @media (prefers-reduced-motion: reduce) { dialog[open], dialog::backdrop { animation: none } }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px) }
  .safe-top { padding-top: env(safe-area-inset-top, 0px) }
  #_toast { position:fixed; bottom:5.5rem; left:50%; transform:translateX(-50%); background:#171717; color:#fff; border-radius:.75rem; padding:.5rem 1.25rem; font-size:.875rem; z-index:200; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; max-width:calc(100vw - 2rem); text-align:center; }
  #_toast.show { opacity:1; }
  /* ── Drag & drop ── */
  .drag-handle { cursor:grab; padding:.35rem .4rem; opacity:.3; touch-action:none; border-radius:.5rem; transition:opacity .15s; flex-shrink:0; }
  .drag-handle:active { cursor:grabbing; opacity:.7; }
  .task-card-wrap.drag-over { outline:2.5px solid var(--accent); outline-offset:2px; border-radius:1.75rem; }
  /* ── Subtask progress ── */
  .sub-bar { height:4px; border-radius:4px; background:rgba(0,0,0,.14); overflow:hidden; }
  .sub-bar-fill { height:100%; border-radius:4px; background:#151515; transition:width .3s; }
  /* ── Timeline ── */
  .tl-row { display:flex; align-items:flex-start; gap:.75rem; min-height:2.75rem; border-top:1px solid var(--line); padding:.4rem 0; }
  .tl-row:first-child { border-top:none; }
  .tl-hour { width:2.75rem; color:var(--muted); font-size:.7rem; font-weight:600; padding-top:.25rem; flex-shrink:0; }
  .tl-tasks { flex:1; display:flex; flex-direction:column; gap:.25rem; }
  .tl-add { opacity:0; color:var(--muted); font-size:.8rem; padding:.15rem .5rem; cursor:pointer; border-radius:.5rem; transition:opacity .2s; }
  .tl-row:hover .tl-add { opacity:1; }
</style>
</head>
<body class="h-full antialiased">

<!-- AUTH -->
<div id="authScreen" class="min-h-full flex flex-col items-center justify-center p-6 safe-top">
  <div id="sbLoadErr" class="hidden w-full max-w-sm mb-4 text-sm text-red-700 bg-red-100 rounded-xl p-3 text-center">
    שגיאה בטעינת הספרייה. בדוק חיבור אינטרנט ורענן.
  </div>
  <div class="w-full max-w-sm">
    <div class="mb-8">
      <div class="inline-grid place-items-center h-14 w-14 rounded-full bg-[#f5cf6b] text-2xl mb-5">✓</div>
      <h1 class="text-4xl font-bold leading-tight">ניהול<br>המשימות שלך</h1>
      <p class="muted mt-2">כל התפקידים במקום אחד</p>
    </div>
    <div class="card p-6">
      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-3">
        <div>
          <label class="label">שם משתמש</label>
          <input name="username" id="usernameInput" required placeholder="הכנס שם משתמש" autocomplete="username" class="input w-full">
        </div>
        <div>
          <label class="label">סיסמה</label>
          <div class="relative">
            <input name="password" id="pwdInput" type="password" required placeholder="לפחות 6 תווים" minlength="6" autocomplete="current-password" class="input w-full ps-10">
            <button type="button" onclick="togglePwd()" aria-label="הצג/הסתר סיסמה"
              class="absolute start-1 top-0 h-full w-10 flex items-center justify-center muted">
              <span id="pwdEye">👁</span>
            </button>
          </div>
        </div>
        <div id="authError" class="hidden text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 rounded-lg p-2"></div>
        <div id="authInfo" class="hidden text-xs text-green-700 dark:text-green-300 bg-green-50 dark:bg-green-950/40 rounded-lg p-2"></div>
        <button type="submit" id="authBtn" class="btn-primary w-full py-2.5">כניסה</button>
        <p class="text-center text-xs muted">משתמש חדש? פשוט בחר שם וסיסמה</p>
      </form>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appRoot" class="hidden min-h-full safe-top">
  <div class="mx-auto w-full max-w-2xl">
    <div id="pageHeader" class="px-5 pt-7 pb-3"></div>
    <div id="pageContent" class="px-5 pb-36"></div>
  </div>
  <nav class="fixed bottom-4 inset-x-0 z-20 flex items-center justify-center gap-3 safe-bottom pointer-events-none">
    <button onclick="openTaskDlg(null)" aria-label="משימה חדשה"
      class="pointer-events-auto grid h-[4.5rem] w-[4.5rem] place-items-center rounded-full bg-[#f5cf6b] text-[#151515] shadow-2xl transition active:scale-95">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="pointer-events-auto flex gap-2 rounded-full bg-[#151515] p-2 shadow-2xl ring-1 ring-white/10">
      <button data-nav="tasks" aria-label="משימות" class="nav-b h-14 w-14 rounded-full flex flex-col items-center justify-center gap-0.5 transition">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>
        <span class="text-[.55rem] font-semibold leading-none">משימות</span></button>
      <button data-nav="calendar" aria-label="לוח שנה" class="nav-b h-14 w-14 rounded-full flex flex-col items-center justify-center gap-0.5 transition">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="text-[.55rem] font-semibold leading-none">לוח</span></button>
      <button data-nav="account" aria-label="חשבון" class="nav-b h-14 w-14 rounded-full flex flex-col items-center justify-center gap-0.5 transition">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c.8-4.5 4.3-7 8.5-7s7.7 2.5 8.5 7z"/></svg>
        <span class="text-[.55rem] font-semibold leading-none">חשבון</span></button>
    </div>
  </nav>
</div>

<!-- TASK DIALOG -->
<dialog id="taskDlg" class="sheet p-0 shadow-2xl" aria-labelledby="taskDlgTitle">
  <div class="sticky top-0 z-10 flex justify-center pt-3 pb-1" style="background:var(--coral)">
    <div class="h-1 w-10 rounded-full bg-black/20"></div>
  </div>
  <div class="px-5 pb-5 pt-2">
    <div class="flex items-center justify-between mb-4">
      <h2 id="taskDlgTitle" class="text-xl font-bold">היי, צור משימה חדשה</h2>
      <button onclick="$('taskDlg').close()" aria-label="סגור"
        class="grid place-items-center h-9 w-9 shrink-0 rounded-full bg-[#151515] text-white text-lg">&times;</button>
    </div>
    <form id="taskForm" onsubmit="handleSaveTask(event)" class="space-y-3">
      <div>
        <label class="label">כותרת *</label>
        <input name="title" required maxlength="120" placeholder="על מה המשימה?" class="input w-full">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="label">תפקיד</label>
          <select name="role" id="roleSelect" class="input w-full"></select>
        </div>
        <div>
          <label class="label">עדיפות</label>
          <select name="priority" class="input w-full">
            <option value="low">🟢 נמוכה</option>
            <option value="medium" selected>🟡 בינונית</option>
            <option value="high">🔴 גבוהה</option>
          </select>
        </div>
      </div>
      <div>
        <label class="label">תאריך ושעה *</label>
        <input name="due" type="datetime-local" required class="input w-full">
      </div>
      <div>
        <label class="label">חזרה</label>
        <select name="recurring" id="recurSelect" class="input w-full" onchange="onRecurChange(this.value)">
          <option value="">ללא חזרה</option>
          <option value="daily">יומי</option>
          <option value="weekly">שבועי (אותו יום)</option>
          <option value="monthly">חודשי (אותו תאריך)</option>
          <option value="custom">ימים ספציפיים...</option>
        </select>
        <div id="customDays" class="hidden mt-2 flex flex-wrap gap-3">
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd0" value="0"> ראשון</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd1" value="1"> שני</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd2" value="2"> שלישי</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd3" value="3"> רביעי</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd4" value="4"> חמישי</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd5" value="5"> שישי</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd6" value="6"> שבת</label>
        </div>
      </div>
      <div>
        <label class="label">תגיות (מופרדות בפסיק)</label>
        <input name="tags" placeholder="לדוגמה: דחוף, לקוח, פגישה" class="input w-full">
      </div>
      <div>
        <label class="label">תיאור</label>
        <textarea name="desc" rows="2" maxlength="600" class="input w-full resize-none"></textarea>
      </div>
      <div>
        <label class="label">תת-משימות</label>
        <div id="subtaskItems" class="space-y-1 mb-2"></div>
        <div class="flex gap-2">
          <input id="subtaskInput" type="text" maxlength="120" placeholder="הוסף תת-משימה..." class="input flex-1"
            onkeydown="if(event.key==='Enter'){event.preventDefault();addSubtask()}">
          <button type="button" onclick="addSubtask()" class="btn-primary px-4 py-2 text-sm shrink-0">+</button>
        </div>
      </div>
      <button type="submit" id="taskSaveBtn" class="btn-primary w-full py-3 text-sm">שמור משימה</button>
      <button type="button" id="taskDelBtn" class="hidden w-full rounded-full py-2 text-sm font-semibold text-[#151515]/70 hover:bg-black/10" onclick="handleDeleteTask()">מחק</button>
    </form>
  </div>
</dialog>

<!-- ROLE DIALOG -->
<dialog id="roleDlg" class="sheet w-[min(24rem,94vw)] rounded-[1.5rem] p-0 shadow-2xl" aria-labelledby="roleDlgTitle">
  <div class="p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 id="roleDlgTitle" class="text-xl font-bold">תפקיד חדש</h2>
      <button onclick="$('roleDlg').close()" aria-label="סגור"
        class="grid place-items-center h-9 w-9 shrink-0 rounded-full bg-[#151515] text-white text-lg">&times;</button>
    </div>
    <form id="roleForm" onsubmit="handleSaveRole(event)" class="space-y-3">
      <div>
        <label class="label">שם תפקיד</label>
        <input name="name" required maxlength="40" placeholder="לדוגמה: עבודה ראשית" class="input w-full">
      </div>
      <div>
        <label class="label">צבע</label>
        <div class="flex flex-wrap gap-2 mb-2" id="colorSwatches"></div>
        <input type="color" name="color" id="colorPicker" aria-label="צבע מותאם" class="h-9 w-16 cursor-pointer rounded-full border border-black/20 bg-transparent">
      </div>
      <button type="submit" id="roleSaveBtn" class="btn-primary w-full py-3 text-sm">שמור תפקיד</button>
      <button type="button" id="roleDelBtn" class="hidden w-full rounded-full py-2 text-sm font-semibold text-[#151515]/70 hover:bg-black/10" onclick="handleDeleteRole()">מחק</button>
    </form>
  </div>
</dialog>

<!-- IMPORT DIALOG -->
<dialog id="importDlg" class="w-[min(22rem,92vw)] card p-5 shadow-2xl" aria-labelledby="importDlgTitle">
  <h3 id="importDlgTitle" class="font-semibold mb-2">🗂 יבוא נתונים מקומיים</h3>
  <p id="importMsg" class="text-sm text-neutral-500 dark:text-neutral-400 mb-4"></p>
  <div class="flex gap-2 justify-start">
    <button class="btn-primary" onclick="confirmImport()">יבוא</button>
    <button class="btn-ghost" onclick="skipImport()">דלג</button>
  </div>
</dialog>

<script>
if (typeof supabase === 'undefined') {
  document.getElementById('sbLoadErr').classList.remove('hidden');
  document.getElementById('authForm').style.pointerEvents = 'none';
  document.getElementById('authForm').style.opacity = '0.4';
  throw new Error('Supabase CDN failed to load');
}
const SB_URL = 'https://gytxwjlicawlfdehszil.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5dHh3amxpY2F3bGZkZWhzemlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MTUyMzgsImV4cCI6MjEwMTA5MTIzOH0.LIBV2W0FTq4MHlyO2Z4iiPvBBGBP1btJaJ-qzUrig64';
const PALETTE = ['#cfe08f','#f5cf6b','#e8695a','#dadad5','#a9c7f2','#c9b6f2','#f2b5d4','#9fd8c8','#f4a76b','#b5d99c'];

const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true } });
const S = {
  user: null, tasks: [], roles: [],
  page: 'tasks', calAnchor: new Date(),
  roleFilter: null, showDone: false,
  editTask: null, editRole: null, pendingImport: null,
  loading: false, editSubtasks: [],
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HE = 'he-IL';
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays  = (d, n) => { const x = dayStart(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => addDays(d, -dayStart(d).getDay());
const sameDay = (a, b) => dayStart(a).getTime() === dayStart(b).getTime();
const monthGrid = d => { const f = new Date(d.getFullYear(), d.getMonth(), 1); return Array.from({length:42}, (_,i) => addDays(startOfWeek(f), i)); };
// datetime-local wants local wall-clock time without a zone
const toLocalInput = v => { const d = new Date(v); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,16); };
const fmtTime = iso => new Date(iso).toLocaleTimeString(HE, {hour:'numeric', minute:'2-digit'});
const fmtDate = iso => new Date(iso).toLocaleDateString(HE, {month:'short', day:'numeric'});
const roleColor = id => S.roles.find(r=>r.id===id)?.color || '#94a3b8';
const roleName  = id => S.roles.find(r=>r.id===id)?.name  || '';
// dark role colors get mixed toward off-white so the card's dark text stays readable
const cardBg = c => { const n=parseInt(c.slice(1),16); const L=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255; return L>.6 ? c : `color-mix(in srgb, ${c} 50%, #f7f6f1)`; };

function toast(msg, type='ok', undoCb=null) {
  let el = $('_toast');
  if (!el) { el = document.createElement('div'); el.id='_toast'; document.body.appendChild(el); }
  el.innerHTML = '';
  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
  if (undoCb) {
    const btn = document.createElement('button');
    btn.textContent = ' · בטל';
    btn.style.cssText = 'font-weight:700;text-decoration:underline;cursor:pointer;background:none;border:none;color:inherit;padding:0;margin:0';
    btn.onclick = () => { el.classList.remove('show'); undoCb(); };
    el.appendChild(btn);
  }
  el.style.background = type==='err' ? '#dc2626' : '#171717';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3200);
}

// ── AUTH ──
function togglePwd() {
  const inp = $('pwdInput'), eye = $('pwdEye');
  if (inp.type === 'password') { inp.type = 'text'; eye.textContent = '🙈'; }
  else { inp.type = 'password'; eye.textContent = '👁'; }
}

function showAuthError(msg) { const e = $('authError'); e.textContent = msg; e.classList.remove('hidden'); $('authInfo').classList.add('hidden'); }
function showAuthInfo(msg)  { const e = $('authInfo');  e.textContent = msg; e.classList.remove('hidden'); $('authError').classList.add('hidden'); }

async function handleAuth(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const username = f.get('username')?.trim(), pass = f.get('password');
  if (!username || !pass) return;
  const email = Array.from(new TextEncoder().encode(username.toLowerCase().trim())).map(b=>b.toString(16).padStart(2,'0')).join('') + '@u.tsk.app';
  const btn = $('authBtn');
  btn.disabled = true; btn.textContent = '...';
  $('authError').classList.add('hidden');
  $('authInfo').classList.add('hidden');
  try {
    // 1. Try to sign in
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (!error) return; // onAuthStateChange handles the rest

    // 2. Sign-in failed — try creating user via edge function
    const res = await fetch(SB_URL + '/functions/v1/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ username: username.trim(), password: pass }),
    });
    const json = await res.json();

    if (json.exists) {
      // User exists but password was wrong
      showAuthError('סיסמה שגויה');
      btn.disabled = false; btn.textContent = 'כניסה'; return;
    }
    if (json.error) {
      showAuthError(json.error);
      btn.disabled = false; btn.textContent = 'כניסה'; return;
    }

    // 3. User just created — sign in
    const { error: err2 } = await sb.auth.signInWithPassword({ email, password: pass });
    if (err2) {
      showAuthError('שגיאה: ' + err2.message);
      btn.disabled = false; btn.textContent = 'כניסה'; return;
    }
    // onAuthStateChange handles redirect
  } catch(ex) {
    showAuthError('שגיאת רשת — בדוק חיבור ונסה שוב');
    btn.disabled = false; btn.textContent = 'כניסה';
  }
}

async function signOut() { await sb.auth.signOut(); location.reload(); }


// ── DATA ──
const TASK_COLS = 'id,title,description,role_id,due,priority,done,tags,recurring,created_at,subtasks,sort_order';
const ok = ({ data, error }) => { if (error) throw error; return data; };
function putRow(key, row) {
  const arr = S[key], i = arr.findIndex(x => x.id === row.id);
  if (i >= 0) arr[i] = row; else arr.push(row);
  if (key === 'tasks') {
    arr.sort((a,b) => {
      if (a.sort_order != null && b.sort_order != null) return a.sort_order - b.sort_order;
      if (a.sort_order != null) return -1;
      if (b.sort_order != null) return 1;
      return new Date(a.due) - new Date(b.due);
    });
  } else {
    arr.sort((a,b) => a.name.localeCompare(b.name, HE));
  }
}
const dropRow = (key, id) => { S[key] = S[key].filter(x => x.id !== id); };

async function loadData() {
  if (!S.user) return;
  const [tasks, roles] = await Promise.all([
    sb.from('tasks').select(TASK_COLS).order('due').then(ok),
    sb.from('task_roles').select('id,name,color').order('name').then(ok),
  ]);
  S.tasks = tasks; S.roles = roles;
  S.loading = false; S.loadErr = false;
  render();
}

async function upsertTask(data) {
  const row = {
    user_id: S.user.id, title: data.title, description: data.description || '',
    role_id: data.role_id || null, due: data.due, priority: data.priority,
    done: data.done || false, tags: Array.isArray(data.tags) ? data.tags : [],
    recurring: data.recurring || null, subtasks: Array.isArray(data.subtasks) ? data.subtasks : [],
  };
  if (data.id) {
    const prev = S.tasks.find(t => t.id === data.id);
    putRow('tasks', { ...prev, ...row }); render();
    try { ok(await sb.from('tasks').update(row).eq('id', data.id)); }
    catch (e) { putRow('tasks', prev); render(); throw e; }
  } else {
    putRow('tasks', ok(await sb.from('tasks').insert(row).select(TASK_COLS).single())); render();
  }
}

async function toggleTask(task) {
  const done = !task.done;
  const set = d => { putRow('tasks', { ...task, done: d }); render(); };
  let next = null;
  set(done);
  if (done) toast('הושלם ✓', 'ok', async () => {
    set(false);
    if (next) { dropRow('tasks', next.id); render(); }
    try {
      ok(await sb.from('tasks').update({ done: false, done_at: null }).eq('id', task.id));
      if (next) ok(await sb.from('tasks').delete().eq('id', next.id));
    } catch { toast('שגיאה בביטול', 'err'); }
  });
  try {
    ok(await sb.from('tasks').update({ done, done_at: done ? new Date().toISOString() : null }).eq('id', task.id));
    const nd = done && task.recurring && nextRecurDate(new Date(task.due), task.recurring);
    if (nd) {
      next = ok(await sb.from('tasks').insert({ user_id:S.user.id, title:task.title, description:task.description, role_id:task.role_id, due:nd.toISOString(), priority:task.priority, done:false, tags:task.tags, recurring:task.recurring }).select(TASK_COLS).single());
      putRow('tasks', next); render();
    }
  } catch { set(task.done); toast('שגיאה בעדכון — בדוק חיבור', 'err'); }
}

function nextRecurDate(d, recurring) {
  const r = new Date(d);
  if (recurring === 'daily')   { r.setDate(r.getDate()+1); return r; }
  if (recurring === 'weekly')  { r.setDate(r.getDate()+7); return r; }
  if (recurring === 'monthly') { r.setMonth(r.getMonth()+1); return r; }
  if (recurring?.startsWith('days:')) {
    const days = recurring.slice(5).split(',').map(Number).sort((a,b)=>a-b);
    const cur = r.getDay();
    const nd = days.find(x=>x>cur) ?? days[0];
    r.setDate(r.getDate() + (nd>cur ? nd-cur : 7-cur+nd));
    return r;
  }
  return null;
}

async function deleteTask(id) {
  const prev = S.tasks.find(t => t.id === id);
  dropRow('tasks', id); render();
  try { ok(await sb.from('tasks').delete().eq('id', id)); }
  catch { putRow('tasks', prev); render(); toast('שגיאה במחיקה — בדוק חיבור', 'err'); }
}

async function upsertRole(name, color, id) {
  if (id) {
    const prev = S.roles.find(r => r.id === id);
    putRow('roles', { ...prev, name, color }); render();
    try { ok(await sb.from('task_roles').update({ name, color }).eq('id', id)); }
    catch (e) { putRow('roles', prev); render(); throw e; }
  } else {
    putRow('roles', ok(await sb.from('task_roles').insert({ user_id: S.user.id, name, color }).select('id,name,color').single())); render();
  }
}

async function deleteRole(id) {
  ok(await sb.from('task_roles').delete().eq('id', id));
  dropRow('roles', id);
  S.tasks.forEach(t => { if (t.role_id === id) t.role_id = null; });
  if (S.roleFilter === id) S.roleFilter = null;
  render();
}

// ── IMPORT ──
function checkImport() {
  try {
    const lt = JSON.parse(localStorage.getItem('td.tasks') || 'null');
    const lr = JSON.parse(localStorage.getItem('td.roles') || 'null');
    if (!lt?.length && !lr?.length) return;
    S.pendingImport = { tasks: lt||[], roles: lr||[] };
    $('importMsg').textContent = `נמצאו ${lt?.length||0} משימות ו-${lr?.length||0} תפקידים שמורים מקומית. לייבא לחשבון?`;
    $('importDlg').showModal();
  } catch {}
}

async function confirmImport() {
  $('importDlg').close();
  const { tasks: lt, roles: lr } = S.pendingImport;
  const map = {};
  for (const r of lr) {
    const { data } = await sb.from('task_roles').insert({ user_id:S.user.id, name:r.name, color:r.color }).select().single();
    if (data) map[r.name] = data.id;
  }
  if (lt.length) await sb.from('tasks').insert(lt.map(t=>({
    user_id:S.user.id, title:t.title, description:t.desc||'',
    role_id: map[t.role]||null, due: new Date(t.due).toISOString(),
    priority:t.priority||'medium', done:t.done||false, tags:[], recurring:null,
  })));
  localStorage.removeItem('td.tasks'); localStorage.removeItem('td.roles');
  S.pendingImport = null;
  await loadData();
}

function skipImport() {
  $('importDlg').close();
  localStorage.removeItem('td.tasks'); localStorage.removeItem('td.roles');
}

// ── TASK CARD ──
const PRIO = { high:'דחופה', medium:'בינונית', low:'נמוכה' };
const ICO_CAL = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/></svg>`;
const ICO_CLK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;

function taskCard(t, groupKey='') {
  const bg = cardBg(roleColor(t.role_id)), name = roleName(t.role_id);
  const overdue = !t.done && new Date(t.due) < dayStart(new Date());

  const subs = Array.isArray(t.subtasks) ? t.subtasks : [];
  const doneC = subs.filter(s=>s.done).length;
  const pct = subs.length ? Math.round(doneC/subs.length*100) : 0;
  const dragH = groupKey ? `<button class="drag-handle" data-drag="${t.id}" data-group="${groupKey}" type="button" aria-label="גרור לסידור מחדש">
    <svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor"><circle cx="3" cy="2" r="1.5"/><circle cx="9" cy="2" r="1.5"/><circle cx="3" cy="8" r="1.5"/><circle cx="9" cy="8" r="1.5"/><circle cx="3" cy="14" r="1.5"/><circle cx="9" cy="14" r="1.5"/></svg>
  </button>` : '';
  return `<div class="task-card-wrap">
    <div data-edit="${t.id}" class="cursor-pointer rounded-[1.75rem] p-5 text-[#151515] transition active:scale-[.99] ${t.done?'opacity-50':''}" style="background:${bg}">
      <div class="flex items-start gap-2">
        ${dragH}
        <button data-edit="${t.id}" class="min-w-0 flex-1 text-start">
          <h3 class="text-xl font-bold leading-snug break-words ${t.done?'line-through':''}">${esc(t.title)}</h3>
        </button>
        <button data-toggle="${t.id}" aria-label="${t.done?'סמן כלא הושלם':'סמן כהושלם'}" aria-pressed="${t.done}"
          class="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-[#151515] text-white text-lg transition hover:scale-105">
          ${t.done?'✓':`<span class="h-4 w-4 rounded-full border-2 border-white/80 grid place-items-center text-[.65rem] opacity-25">✓</span>`}</button>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-3 text-base font-semibold">
        <span class="inline-flex items-center gap-1.5"><span class="grid h-7 w-7 place-items-center rounded-full bg-black/10">${ICO_CAL}</span>${fmtDate(t.due)}</span>
        <span class="h-4 w-px bg-black/25"></span>
        <span class="inline-flex items-center gap-1.5"><span class="grid h-7 w-7 place-items-center rounded-full bg-black/10">${ICO_CLK}</span>${fmtTime(t.due)}</span>
        ${overdue?`<span class="rounded-full bg-[#151515] px-2.5 py-1 text-xs text-white">באיחור</span>`:''}
      </div>
      <div class="mt-4 flex items-center gap-2 rounded-full bg-white/75 p-1.5 ps-4">
        <span class="min-w-0 flex-1 truncate text-sm font-semibold">${esc(name||'ללא תפקיד')}${t.recurring?' · 🔁':''}${tags.length?` <span class="font-normal opacity-60">· ${tags.map(esc).join(' · ')}</span>`:''}</span>
        <span class="shrink-0 rounded-full px-3 py-1 text-xs font-bold ${t.priority==='high'?'bg-[#151515] text-white':''}" style="${t.priority==='high'?'':`background:${bg}`}">${PRIO[t.priority]||''}</span>
      </div>
      ${subs.length ? `<div class="mt-3 flex items-center gap-2">
        <div class="sub-bar flex-1"><div class="sub-bar-fill" style="width:${pct}%"></div></div>
        <span class="text-xs font-semibold opacity-60">${doneC}/${subs.length}</span>
      </div>` : ''}
    </div>
  </div>`;
}

function section(title, tasks, empty=null, groupKey='') {
  if (!tasks.length && empty===null) return '';
  return `<section class="mb-7" data-group="${groupKey}">
    <h2 class="mb-3 flex items-baseline gap-2 text-lg font-bold">${title}<span class="text-sm font-medium muted">${tasks.length||''}</span></h2>
    ${tasks.length
      ? `<div class="space-y-3">${tasks.map(t=>taskCard(t,groupKey)).join('')}</div>`
      : `<p class="card py-6 text-center text-sm muted">${empty}</p>`}
  </section>`;
}

// ── PAGES ──
function render() {
  if (S.page === 'tasks') { renderTasks(); requestAnimationFrame(initGestures); }
  else if (S.page === 'calendar') { renderCalendar(); requestAnimationFrame(initGestures); }
  else renderAccount();
}

function dateStrip() {
  const today = dayStart(new Date());
  const days = Array.from({length:15}, (_,i) => addDays(today, i-2));
  const pill = (val, on, top, bottom, ariaLabel='') => `<button data-day="${val}" ${ariaLabel?`aria-label="${ariaLabel}"`:''}class="pill ${on?'on':''} shrink-0 text-center ${bottom?'py-2':''}">
    <span class="block">${top}</span>${bottom?`<span class="block text-[.7rem]">${bottom}</span>`:''}</button>`;
  return `<div id="dayStrip" class="no-sb -mx-5 mb-5 flex gap-2 overflow-x-auto px-5 py-1">
    ${pill('', !S.day, 'הכל', '', 'כל הימים')}
    ${days.map(d => {
      const isT = sameDay(d, today), cnt = S.tasks.filter(t=>!t.done&&sameDay(new Date(t.due),d)).length;
      const dateStr = d.toLocaleDateString(HE,{day:'numeric',month:'short'});
      return pill(d.getTime(), S.day && sameDay(S.day,d),
        dateStr,
        isT ? 'היום' : (cnt ? '•'.repeat(Math.min(cnt,3)) : d.toLocaleDateString(HE,{weekday:'short'})),
        cnt ? `${dateStr}, ${cnt} משימות` : dateStr);
    }).join('')}
  </div>`;
}

function taskGroups() {
  const today = dayStart(new Date());
  const tmrw = addDays(today,1), dayAfter = addDays(today,2), weekEnd = addDays(today,8);
  const all = S.tasks.filter(t => !S.roleFilter || t.role_id === S.roleFilter);
  const pend = all.filter(t=>!t.done);
  return { today, all, pend,
    done:      all.filter(t=>t.done),
    overdue:   pend.filter(t=>new Date(t.due)<today),
    todayT:    pend.filter(t=>{ const d=new Date(t.due); return d>=today&&d<tmrw; }),
    tomorrowT: pend.filter(t=>{ const d=new Date(t.due); return d>=tmrw&&d<dayAfter; }),
    impWeek:   pend.filter(t=>{ const d=new Date(t.due); return t.priority==='high'&&d>=dayAfter&&d<weekEnd; }),
    rest:      pend.filter(t=>{ const d=new Date(t.due); return d>=dayAfter&&!(t.priority==='high'&&d<weekEnd); }),
  };
}

function taskListHtml() {
  const { today, all, done, overdue, todayT, tomorrowT, impWeek, rest } = taskGroups();
  const q = (S.q || '').trim().toLowerCase();
  if (q) {
    const hits = all.filter(t => [t.title, t.description, ...(t.tags||[])].some(s => s?.toLowerCase().includes(q))).sort((a,b)=>a.done-b.done);
    return section('תוצאות חיפוש', hits, 'לא נמצאו משימות תואמות');
  }
  const chips = S.roles.length > 1 ? `<div class="no-sb -mx-5 mb-6 flex gap-2 overflow-x-auto px-5">
    <button data-rf="" class="pill shrink-0 ${!S.roleFilter?'on':''}">כל התפקידים</button>
    ${S.roles.map(r=>`<button data-rf="${r.id}" class="pill shrink-0 inline-flex items-center gap-1.5 ${S.roleFilter===r.id?'on':''}">
      <span class="h-2.5 w-2.5 rounded-full" style="background:${r.color}"></span>${esc(r.name)}</button>`).join('')}
  </div>` : '';
  let body;
  if (S.day) {
    const list = all.filter(t=>sameDay(new Date(t.due),S.day)).sort((a,b)=>a.done-b.done);
    body = section(sameDay(S.day,today)?'היום':S.day.toLocaleDateString(HE,{weekday:'long',day:'numeric',month:'long'}), list, 'אין משימות ביום הזה', 'day');
  } else {
    body = section('באיחור', overdue, null, 'overdue') +
      section('היום', todayT, '🎉 אין משימות להיום', 'today') +
      section('מחר', tomorrowT, null, 'tomorrow') +
      section('חשובות השבוע', impWeek, null, 'important') +
      section('בהמשך', rest, null, 'later') +
      (done.length ? `<button onclick="toggleShowDone()" class="pill mx-auto block">${S.showDone?'הסתר שהושלמו':'הצג '+done.length+' שהושלמו'}</button>` : '') +
      (S.showDone && done.length ? '<div class="mt-6">'+section('הושלמו', done.slice(0,20))+'</div>' : '');
  }
  return dateStrip() + chips + body;
}

function renderAccount() {
  const user = S.user;
  const dn = user?.user_metadata?.display_name || user?.email?.split('@')[0] || '';
  const currentTheme = lsGet('td.theme', 'dark');
  const isDark = document.documentElement.classList.contains('dark');
  $('pageHeader').innerHTML = `<div class="flex items-center justify-between">
    <h1 class="text-3xl font-bold">חשבון</h1>
    <button onclick="signOut()" class="pill">התנתקות</button></div>`;
  $('pageContent').innerHTML = `
    <section class="card p-5 mb-4">
      <h2 class="text-sm font-semibold mb-3">👤 פרופיל</h2>
      <div class="space-y-2 text-sm">
        <div>
          <label class="label">שם לתצוגה</label>
          <div class="flex gap-2">
            <input id="dnInput" value="${esc(dn)}" maxlength="40" class="input flex-1">
            <button onclick="updateDisplayName()" class="btn-primary py-1.5 px-3 text-xs whitespace-nowrap">עדכן</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card p-5 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold">🏷️ תפקידים</h2>
        <button onclick="openRoleDlg(null)" class="text-xs font-medium text-neutral-900 dark:text-neutral-100 hover:underline">+ הוסף</button>
      </div>
      ${S.loading
        ? Array(2).fill(`<div class="flex items-center gap-3 py-2.5 border-b border-neutral-100 dark:border-neutral-800 last:border-0 animate-pulse">
          <div class="h-4 w-4 rounded-full shrink-0 surface2"></div>
          <div class="h-3 rounded surface2 w-1/3"></div>
        </div>`).join('')

        <div class="flex items-center gap-3 py-2.5 border-b border-neutral-100 dark:border-neutral-800 last:border-0">
          <span class="h-4 w-4 rounded-full shrink-0" style="background:${r.color}"></span>
          <span class="flex-1 text-sm">${esc(r.name)}</span>
          <span class="text-xs text-neutral-400">${S.tasks.filter(t=>t.role_id===r.id&&!t.done).length} פתוחות</span>
          <button data-er="${r.id}" class="text-xs btn-ghost py-1 px-2">ערוך</button>
        </div>`).join('')

      <div class="flex items-center justify-between">

        <div class="flex surface2 rounded-full p-1 gap-1">

        </div>
      </div>
    </section>`;
}

async function updateDisplayName() {
  const val = $('dnInput')?.value.trim();
  if (!val) return;
  const { error } = await sb.auth.updateUser({ data: { display_name: val } });
  if (error) { toast('שגיאה בעדכון השם', 'err'); return; }
  S.user.user_metadata = { ...S.user.user_metadata, display_name: val };
  toast('שם עודכן ✓');
}

// ── TASK MODAL ──
let _delTaskTimer = null;

function openTaskDlg(task) {
  S.editTask = task?.id ? task : null; // only treat as edit if has real id
  $('taskDlgTitle').textContent = task?.id ? 'עריכת משימה' : 'היי, צור משימה חדשה';
  $('taskSaveBtn').disabled = false; $('taskSaveBtn').textContent = task?.id ? 'שמור שינויים' : 'צור משימה';
  const delBtn = $('taskDelBtn');
  delBtn.classList.toggle('hidden', !task?.id);
  delBtn.textContent = 'מחק'; delete delBtn.dataset.confirming; clearTimeout(_delTaskTimer);
  $('roleSelect').innerHTML = `<option value="">ללא תפקיד</option>` +
    S.roles.map(r=>`<option value="${r.id}" ${task?.role_id===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
  const f = $('taskForm'); f.reset();
  $('customDays').classList.add('hidden');
  if (task) {
    f.title.value = task.title || ''; f.desc.value = task.description || '';
    f.due.value = task.due ? toLocalInput(task.due) : '';
    f.priority.value = task.priority || 'medium';
    f.tags.value = Array.isArray(task.tags) ? task.tags.join(', ') : '';
    if (task.recurring?.startsWith('days:')) {
      $('recurSelect').value = 'custom'; $('customDays').classList.remove('hidden');
      task.recurring.slice(5).split(',').forEach(d => { const cb = f.querySelector(`[name=rd${d}]`); if (cb) cb.checked = true; });
    } else { $('recurSelect').value = task.recurring || ''; }
  } else {
    const d = new Date(); d.setMinutes(0,0,0); d.setHours(d.getHours()+1);
    f.due.value = toLocalInput(d);
  }
  S.editSubtasks = Array.isArray(task?.subtasks) ? task.subtasks.map(s=>({...s})) : [];
  renderSubtasksInDlg();
  $('taskDlg').showModal(); f.title.focus();
}

function onRecurChange(v) { $('customDays').classList.toggle('hidden', v!=='custom'); }

async function handleSaveTask(e) {
  e.preventDefault();
  const btn = $('taskSaveBtn');
  btn.disabled = true; btn.textContent = 'שומר...';
  try {
    const f = new FormData(e.target);
    let recurring = f.get('recurring') || null;
    if (recurring === 'custom') {
      const days = [0,1,2,3,4,5,6].filter(i=>f.get(`rd${i}`));
      recurring = days.length ? `days:${days.join(',')}` : null;
    }
    await upsertTask({
      id: S.editTask?.id,
      title: f.get('title').trim(), description: f.get('desc').trim(),
      role_id: f.get('role') || null, due: new Date(f.get('due')).toISOString(),
      priority: f.get('priority'), done: S.editTask?.done || false,
      tags: (f.get('tags')||'').split(',').map(s=>s.trim()).filter(Boolean),
      recurring, subtasks: S.editSubtasks,
    });
    $('taskDlg').close();
  } catch {
    toast('השמירה נכשלה — בדוק חיבור ונסה שוב', 'err');
    btn.disabled = false; btn.textContent = 'נסה שוב';
  }
}

async function handleDeleteTask() {
  if (!S.editTask) return;
  const btn = $('taskDelBtn');
  if (!btn.dataset.confirming) {
    btn.dataset.confirming = '1';
    btn.textContent = '⚠️ בטוח?';
    _delTaskTimer = setTimeout(() => { delete btn.dataset.confirming; btn.textContent = 'מחק'; }, 3000);
    return;
  }
  clearTimeout(_delTaskTimer);
  $('taskDlg').close();
  await deleteTask(S.editTask.id);
}

// ── ROLE MODAL ──
let _delRoleTimer = null;

function openRoleDlg(role) {
  S.editRole = role || null;
  $('roleDlgTitle').textContent = role ? 'ערוך תפקיד' : 'תפקיד חדש';
  const delBtn = $('roleDelBtn');
  delBtn.classList.toggle('hidden', !role);
  delBtn.textContent = 'מחק'; delete delBtn.dataset.confirming; clearTimeout(_delRoleTimer);
  const f = $('roleForm'); f.reset();
  if (role) { f.name.value = role.name; $('colorPicker').value = role.color; }
  else { $('colorPicker').value = PALETTE[S.roles.length % PALETTE.length]; }
  $('colorSwatches').innerHTML = PALETTE.map(c=>`<button type="button" data-swatch="${c}"
    class="h-7 w-7 rounded-full border-2 transition hover:scale-110"
    style="background:${c};border-color:${$('colorPicker').value===c?'#000':'rgba(0,0,0,.18)'}" onclick="pickSwatch('${c}')"></button>`).join('');
  $('roleDlg').showModal(); f.name.focus();
}

function pickSwatch(c) {
  $('colorPicker').value = c;
  document.querySelectorAll('[data-swatch]').forEach(b => { b.style.borderColor = b.dataset.swatch===c ? '#000' : 'rgba(0,0,0,.18)'; });
}

$('colorPicker') && $('colorPicker').addEventListener('input', e => pickSwatch(e.target.value));

async function handleSaveRole(e) {
  e.preventDefault();
  const f = new FormData(e.target), btn = $('roleSaveBtn');
  btn.disabled = true;
  try { await upsertRole(f.get('name').trim(), $('colorPicker').value, S.editRole?.id); $('roleDlg').close(); }
  catch { toast('השמירה נכשלה — בדוק חיבור ונסה שוב', 'err'); }
  btn.disabled = false;
}

async function handleDeleteRole() {
  if (!S.editRole) return;
  const btn = $('roleDelBtn');
  if (!btn.dataset.confirming) {
    btn.dataset.confirming = '1';
    btn.textContent = '⚠️ בטוח?';
    _delRoleTimer = setTimeout(() => { delete btn.dataset.confirming; btn.textContent = 'מחק'; }, 3000);
    return;
  }
  clearTimeout(_delRoleTimer);
  try { await deleteRole(S.editRole.id); $('roleDlg').close(); }
  catch { toast('המחיקה נכשלה — בדוק חיבור ונסה שוב', 'err'); }
}

// ── SUBTASKS ──
function renderSubtasksInDlg() {
  const el = $('subtaskItems');
  if (!el) return;
  el.innerHTML = S.editSubtasks.length ? S.editSubtasks.map((s,i) => `
    <div class="flex items-center gap-2 rounded-xl bg-white/50 px-3 py-2">
      <input type="checkbox" ${s.done?'checked':''} onchange="S.editSubtasks[${i}].done=this.checked;renderSubtasksInDlg()" class="h-4 w-4 cursor-pointer">
      <span class="flex-1 text-sm ${s.done?'line-through opacity-50':''}">${esc(s.text)}</span>
      <button type="button" onclick="removeSubtask('${s.id}')" class="text-base opacity-40 hover:opacity-80 leading-none">×</button>
    </div>`).join('') : '';
}

function addSubtask() {
  const inp = $('subtaskInput');
  const text = inp?.value.trim();
  if (!text) return;
  S.editSubtasks.push({ id: crypto.randomUUID(), text, done: false });
  inp.value = '';
  renderSubtasksInDlg();
  inp.focus();
}

function removeSubtask(id) {
  S.editSubtasks = S.editSubtasks.filter(s => s.id !== id);
  renderSubtasksInDlg();
}

// ── TIMELINE (calendar day view) ──
function timelineHtml(tasks, date) {
  const lbl = sameDay(date, new Date()) ? 'היום' : date.toLocaleDateString(HE, {weekday:'long', day:'numeric', month:'long'});
  if (!tasks.length) {
    return `<section class="mb-7">
      <h2 class="mb-3 text-lg font-bold">${lbl}</h2>
      <div class="card p-4 text-center text-sm muted">
        <p class="mb-2">אין משימות ביום הזה</p>
        <button onclick="openTaskDlg({due:new Date(${date.getTime()}).toISOString()})" class="btn-primary text-xs py-2 px-4">+ הוסף משימה</button>
      </div></section>`;
  }
  const rows = [];
  for (let h = 6; h <= 23; h++) {
    const slotTasks = tasks.filter(t => new Date(t.due).getHours() === h);
    if (slotTasks.length || tasks.some(t => new Date(t.due).getHours() < 6 && h === 6)) {
      rows.push({ h, slotTasks });
    } else {
      rows.push({ h, slotTasks: [] });
    }
  }
  // Also bucket tasks before 6am into 6am slot
  const early = tasks.filter(t => new Date(t.due).getHours() < 6);
  if (early.length && rows[0]) rows[0].slotTasks = [...early, ...rows[0].slotTasks];

  const d = new Date(date); // copy to safely set hours
  return `<section class="mb-7">
    <h2 class="mb-3 text-lg font-bold">${lbl}</h2>
    <div class="card px-4 py-2">
      ${rows.map(({h, slotTasks}) => {
        const slotTime = new Date(d); slotTime.setHours(h, 0, 0, 0);
        return `<div class="tl-row">
          <div class="tl-hour">${String(h).padStart(2,'0')}:00</div>
          <div class="tl-tasks">
            ${slotTasks.map(t => `<div data-edit="${t.id}" class="cursor-pointer rounded-xl px-3 py-1.5 text-sm font-semibold text-[#151515] transition active:scale-[.99] ${t.done?'opacity-50 line-through':''}" style="background:${cardBg(roleColor(t.role_id))}">${esc(t.title)}</div>`).join('')}
            <button class="tl-add" onclick="openTaskDlg({due:'${slotTime.toISOString()}'})">+ הוסף</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  </section>`;
}

// ── DRAG & DROP REORDER ──
let _drag = null;

function initDrag() {
  document.querySelectorAll('[data-drag]').forEach(handle => {
    if (handle._dr) return;
    handle._dr = true;
    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      const wrap = handle.closest('.task-card-wrap');
      const rect = wrap.getBoundingClientRect();
      const clone = wrap.cloneNode(true);
      clone.style.cssText = `position:fixed;top:${rect.top}px;left:${rect.left}px;width:${rect.width}px;z-index:300;opacity:.85;pointer-events:none;border-radius:1.75rem;box-shadow:0 12px 32px rgba(0,0,0,.25);transition:transform .05s`;
      document.body.appendChild(clone);
      _drag = { id:handle.dataset.drag, group:handle.dataset.group, wrap, clone, startY:e.clientY, hoverWrap:null };
      wrap.style.opacity = '.25';
      handle.setPointerCapture(e.pointerId);
    });

    handle.addEventListener('pointermove', e => {
      if (!_drag || _drag.id !== handle.dataset.drag) return;
      const dy = e.clientY - _drag.startY;
      _drag.clone.style.transform = `translateY(${dy}px)`;
      const els = [...document.querySelectorAll(`[data-group="${_drag.group}"] .task-card-wrap`)].filter(el=>el!==_drag.wrap);
      document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
      let hw = null;
      for (const el of els) {
        const r = el.getBoundingClientRect();
        if (e.clientY >= r.top && e.clientY <= r.bottom) { hw = el; break; }
      }
      if (hw) hw.classList.add('drag-over');
      _drag.hoverWrap = hw;
    });

    handle.addEventListener('pointerup', () => {
      if (!_drag || _drag.id !== handle.dataset.drag) return;
      const { id, group, wrap, clone, hoverWrap } = _drag;
      _drag = null;
      clone.remove(); wrap.style.opacity = '';
      document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
      if (hoverWrap) {
        const targetHandle = hoverWrap.querySelector('[data-drag]');
        if (targetHandle?.dataset.drag && targetHandle.dataset.drag !== id) {
          reorderInGroup(id, targetHandle.dataset.drag, group);
        }
      }
    });

    handle.addEventListener('pointercancel', () => {
      if (!_drag || _drag.id !== handle.dataset.drag) return;
      const { wrap, clone } = _drag; _drag = null;
      clone.remove(); wrap.style.opacity = '';
      document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
    });
  });
}

async function reorderInGroup(dragId, targetId, group) {
  const section = document.querySelector(`[data-group="${group}"]`);
  if (!section) return;
  const ids = [...section.querySelectorAll('[data-drag]')].map(h=>h.dataset.drag);
  const from = ids.indexOf(dragId), to = ids.indexOf(targetId);
  if (from < 0 || to < 0) return;
  ids.splice(from, 1); ids.splice(to, 0, dragId);
  const updates = ids.map((id,i) => ({ id, sort_order: (i+1)*100 }));
  updates.forEach(({id,sort_order}) => { const t=S.tasks.find(x=>x.id===id); if(t) t.sort_order=sort_order; });
  render();
  try { await Promise.all(updates.map(({id,sort_order}) => sb.from('tasks').update({sort_order}).eq('id',id))); }
  catch { toast('שגיאה בסידור', 'err'); loadData(); }
}

function initGestures() { initDrag(); }

// ── GLOBAL CLICKS ──
document.addEventListener('click', e => {
  const b = e.target.closest('[data-nav],[data-toggle],[data-edit],[data-rf],[data-cal],[data-er],[data-day],[data-goday]');
  if (!b) return;
  if ('day' in b.dataset) { S.day = b.dataset.day ? new Date(+b.dataset.day) : null; renderTasks(); return; }
  if (b.dataset.goday) { S.calDay = new Date(+b.dataset.goday); renderCalendar(); return; }
  if (b.dataset.nav)    { navTo(b.dataset.nav); return; }
  if (b.dataset.toggle) { const t=S.tasks.find(x=>x.id===b.dataset.toggle); if(t) toggleTask(t); return; }
  if (b.dataset.edit)   { const t=S.tasks.find(x=>x.id===b.dataset.edit);   if(t) openTaskDlg(t); return; }
  if ('rf' in b.dataset) { S.roleFilter = b.dataset.rf || null; renderTasks(); return; }
  if (b.dataset.cal !== undefined) {
    const n=+b.dataset.cal;
    if(n===0) { S.calAnchor=new Date(); S.calDay=null; }
    else S.calAnchor=new Date(S.calAnchor.getFullYear(), S.calAnchor.getMonth()+n, 1);
    renderCalendar(); return;
  }
  if (b.dataset.er) { const r=S.roles.find(x=>x.id===b.dataset.er); if(r) openRoleDlg(r); return; }
});

// ── REALTIME ──
let _realtimeReady = false;
function setupRealtime() {
  if (_realtimeReady) return;
  _realtimeReady = true;
  const apply = key => ({ eventType, new: n, old: o }) => {
    if (eventType === 'DELETE') dropRow(key, o.id); else putRow(key, n);
    if (!S.loading) render();
  };
  sb.channel('task-sync')
    .on('postgres_changes', {event:'*',schema:'public',table:'tasks',     filter:`user_id=eq.${S.user.id}`}, apply('tasks'))
    .on('postgres_changes', {event:'*',schema:'public',table:'task_roles',filter:`user_id=eq.${S.user.id}`}, apply('roles'))
    .subscribe();
}

// ── INIT ──
applyTheme(lsGet('td.theme', 'dark'));

function showApp() { $('authScreen').classList.add('hidden'); $('appRoot').classList.remove('hidden'); }

async function boot() {
  S.loading = true; S.loadErr = false;
  navTo(S.page);
  try { await loadData(); }
  catch (e) { S.loading = false; S.loadErr = true; render(); console.warn('loadData', e); }
  setupRealtime();
  checkImport();
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user && !S.user) { S.user = session.user; showApp(); boot(); }
})();

// Don't await Supabase calls inside this callback — supabase-js can deadlock on its auth lock
sb.auth.onAuthStateChange((event, session) => {
  const wasLoggedIn = !!S.user;
  S.user = session?.user || null;
  if (S.user) {
    showApp();
    if (!wasLoggedIn) boot();
  } else {
    $('authScreen').classList.remove('hidden');
    $('appRoot').classList.add('hidden');
    _realtimeReady = false;
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
