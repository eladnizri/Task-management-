        </div>

</div>

<!-- TASK DIALOG -->

  <div class="p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 id="taskDlgTitle" class="font-semibold">משימה חדשה</h2>
      <button onclick="$('taskDlg').close()" aria-label="סגור"
        class="flex items-center justify-center h-10 w-10 rounded-xl text-neutral-400 hover:text-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition text-xl">&times;</button>
    </div>
    <form id="taskForm" onsubmit="handleSaveTask(event)" class="space-y-3">
      <div>
        <label class="label">כותרת *</label>
        <input name="title" required maxlength="120" placeholder="על מה המשימה?" class="input w-full">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="label">תפקיד</label>
          <select name="role" id="roleSelect" class="input w-full"></select>
        </div>
        <div>
          <label class="label">עדיפות</label>
          <select name="priority" class="input w-full">

            <option value="high">🔴 גבוהה</option>

        </div>
      </div>

        <label class="label">תאריך ושעה *</label>

      </div>
      <div>
        <label class="label">חזרה</label>
        <select name="recurring" id="recurSelect" class="input w-full" onchange="onRecurChange(this.value)">

          <option value="daily">יומי</option>
          <option value="weekly">שבועי (אותו יום)</option>
          <option value="monthly">חודשי (אותו תאריך)</option>
          <option value="custom">ימים ספציפיים...</option>

        <div id="customDays" class="hidden mt-2 flex flex-wrap gap-3">

          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd1" value="1"> שני</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd2" value="2"> שלישי</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd3" value="3"> רביעי</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd4" value="4"> חמישי</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd5" value="5"> שישי</label>
          <label class="flex items-center gap-1 text-xs"><input type="checkbox" name="rd6" value="6"> שבת</label>
        </div>
      </div>
      <div>
        <label class="label">תגיות (מופרדות בפסיק)</label>
        <input name="tags" placeholder="לדוגמה: דחוף, לקוח, פגישה" class="input w-full">
      </div>
      <div>
        <label class="label">תיאור</label>
        <textarea name="desc" rows="2" maxlength="600" class="input w-full resize-none"></textarea>
      </div>

        <button type="button" id="taskDelBtn" class="hidden text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg px-3 py-1.5 transition" onclick="handleDeleteTask()">מחק</button>

        <button type="button" class="btn-ghost" onclick="$('taskDlg').close()">ביטול</button>

        <div class="flex-1"></div>

<!-- IMPORT DIALOG -->
<dialog id="importDlg" class="w-[min(22rem,92vw)] card p-5 shadow-2xl" aria-labelledby="importDlgTitle">
  <h3 id="importDlgTitle" class="font-semibold mb-2">🗂 יבוא נתונים מקומיים</h3>
  <p id="importMsg" class="text-sm text-neutral-500 dark:text-neutral-400 mb-4"></p>

    <button class="btn-primary" onclick="confirmImport()">יבוא</button>
    <button class="btn-ghost" onclick="skipImport()">דלג</button>

<script>
const SB_URL = 'https://gytxwjlicawlfdehszil.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5dHh3amxpY2F3bGZkZWhzemlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MTUyMzgsImV4cCI6MjEwMTA5MTIzOH0.LIBV2W0FTq4MHlyO2Z4iiPvBBGBP1btJaJ-qzUrig64';
const PALETTE = ['#2563eb','#db2777','#059669','#d97706','#7c3aed','#0891b2','#dc2626','#65a30d','#0d9488','#9333ea'];

const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true } });
const S = {
  user: null, tasks: [], roles: [],
  page: 'tasks', calAnchor: new Date(),
  roleFilter: null, showDone: false,
  editTask: null, editRole: null, pendingImport: null,
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HE = 'he-IL';
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays  = (d, n) => { const x = dayStart(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => addDays(d, -dayStart(d).getDay());
const sameDay = (a, b) => dayStart(a).getTime() === dayStart(b).getTime();
const monthGrid = d => { const f = new Date(d.getFullYear(), d.getMonth(), 1); return Array.from({length:42}, (_,i) => addDays(startOfWeek(f), i)); };
const fmtTime = iso => new Date(iso).toLocaleTimeString(HE, {hour:'numeric', minute:'2-digit'});
const fmtDate = iso => new Date(iso).toLocaleDateString(HE, {month:'short', day:'numeric'});
const roleColor = id => S.roles.find(r=>r.id===id)?.color || '#94a3b8';
const roleName  = id => S.roles.find(r=>r.id===id)?.name  || '';

function toast(msg, type='ok') {
  let el = $('_toast');
  if (!el) { el = document.createElement('div'); el.id='_toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.style.background = type==='err' ? '#dc2626' : '#171717';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function sbErr(msg) {
  if (!msg) return 'שגיאה. נסה שוב.';
  if (msg.includes('Invalid login credentials')) return 'אימייל או סיסמה שגויים';
  if (msg.includes('already registered') || msg.includes('already been registered')) return 'כתובת אימייל זו כבר רשומה';
  if (msg.includes('Email not confirmed')) return 'האימייל טרם אושר — בדוק את תיבת הדואר';
  if (msg.includes('Password should be') || msg.includes('weak_password')) return 'הסיסמה חייבת להכיל לפחות 6 תווים';
  if (msg.includes('rate limit') || msg.includes('too many')) return 'נסיונות רבים מדי — נסה שוב עוד דקה';
  return 'שגיאה. נסה שוב.';
}

// ── AUTH ──
function setAuthMode(mode) {
  const login = mode === 'login';
  const on = 'rounded-lg py-2 text-sm font-medium bg-neutral-900 text-white dark:bg-white dark:text-neutral-900';
  const off = 'rounded-lg py-2 text-sm font-medium text-neutral-500 hover:text-neutral-900 dark:hover:text-neutral-100';
  $('tabLogin').className = login ? on : off;
  $('tabRegister').className = login ? off : on;
  $('nameField').classList.toggle('hidden', login);
  $('authBtn').textContent = login ? 'כניסה' : 'הרשמה';
  $('authError').classList.add('hidden');
  $('pwdInput').autocomplete = login ? 'current-password' : 'new-password';
  S.authMode = mode;
}

function togglePwd() {
  const inp = $('pwdInput'), eye = $('pwdEye');
  if (inp.type === 'password') { inp.type = 'text'; eye.textContent = '🙈'; }
  else { inp.type = 'password'; eye.textContent = '👁'; }
}

async function handleAuth(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const email = f.get('email').trim(), pass = f.get('password');
  $('authBtn').disabled = true; $('authBtn').textContent = '...';
  $('authError').classList.add('hidden');
  let err;
  if (S.authMode === 'login') {
    ({ error: err } = await sb.auth.signInWithPassword({ email, password: pass }));
  } else {
    const name = f.get('displayName')?.trim() || email.split('@')[0];
    ({ error: err } = await sb.auth.signUp({ email, password: pass, options: { data: { display_name: name } } }));
    if (!err) { showAuthError('✉️ נשלח מייל אימות — אשר את הכתובת ואז היכנס.'); $('authBtn').disabled = false; setAuthMode('login'); return; }
  }
  $('authBtn').disabled = false;
  setAuthMode(S.authMode);
  if (err) showAuthError(sbErr(err.message));
}

function showAuthError(msg) { const e = $('authError'); e.textContent = msg; e.classList.remove('hidden'); }
async function signOut() { await sb.auth.signOut(); location.reload(); }

// ── DATA ──
async function loadData() {
  if (!S.user) return;
  const [{ data: tasks }, { data: roles }] = await Promise.all([
    sb.from('tasks').select('*').order('due'),
    sb.from('task_roles').select('*').order('name'),
  ]);
  S.tasks = tasks || []; S.roles = roles || [];
  render();
}

async function upsertTask(data) {
  const row = {
    user_id: S.user.id, title: data.title, description: data.description || '',
    role_id: data.role_id || null, due: data.due, priority: data.priority,
    done: data.done || false, tags: Array.isArray(data.tags) ? data.tags : [],
    recurring: data.recurring || null,
  };
  if (data.id) await sb.from('tasks').update(row).eq('id', data.id);
  else await sb.from('tasks').insert(row);
  await loadData();
}

async function toggleTask(task) {
  const done = !task.done;
  await sb.from('tasks').update({ done, done_at: done ? new Date().toISOString() : null }).eq('id', task.id);
  if (done && task.recurring) {
    const next = nextRecurDate(new Date(task.due), task.recurring);
    if (next) await sb.from('tasks').insert({ user_id:S.user.id, title:task.title, description:task.description, role_id:task.role_id, due:next.toISOString(), priority:task.priority, done:false, tags:task.tags, recurring:task.recurring });
  }
  await loadData();
}

function nextRecurDate(d, recurring) {
  const r = new Date(d);
  if (recurring === 'daily')   { r.setDate(r.getDate()+1); return r; }
  if (recurring === 'weekly')  { r.setDate(r.getDate()+7); return r; }
  if (recurring === 'monthly') { r.setMonth(r.getMonth()+1); return r; }
  if (recurring?.startsWith('days:')) {
    const days = recurring.slice(5).split(',').map(Number).sort((a,b)=>a-b);
    const cur = r.getDay();
    const nd = days.find(x=>x>cur) ?? days[0];
    r.setDate(r.getDate() + (nd>cur ? nd-cur : 7-cur+nd));
    return r;
  }
  return null;
}

async function deleteTask(id) { await sb.from('tasks').delete().eq('id', id); await loadData(); }

async function upsertRole(name, color, id) {
  if (id) await sb.from('task_roles').update({ name, color }).eq('id', id);
  else await sb.from('task_roles').insert({ user_id: S.user.id, name, color });
  await loadData();
}

async function deleteRole(id) { await sb.from('task_roles').delete().eq('id', id); await loadData(); }

// ── IMPORT ──
function checkImport() {
  try {
    const lt = JSON.parse(localStorage.getItem('td.tasks') || 'null');
    const lr = JSON.parse(localStorage.getItem('td.roles') || 'null');
    if (!lt?.length && !lr?.length) return;
    S.pendingImport = { tasks: lt||[], roles: lr||[] };
    $('importMsg').textContent = `נמצאו ${lt?.length||0} משימות ו-${lr?.length||0} תפקידים שמורים מקומית. לייבא לחשבון?`;
    $('importDlg').showModal();
  } catch {}
}

async function confirmImport() {
  $('importDlg').close();
  const { tasks: lt, roles: lr } = S.pendingImport;
  const map = {};
  for (const r of lr) {
    const { data } = await sb.from('task_roles').insert({ user_id:S.user.id, name:r.name, color:r.color }).select().single();
    if (data) map[r.name] = data.id;
  }
  if (lt.length) await sb.from('tasks').insert(lt.map(t=>({
    user_id:S.user.id, title:t.title, description:t.desc||'',
    role_id: map[t.role]||null, due: new Date(t.due).toISOString(),
    priority:t.priority||'medium', done:t.done||false, tags:[], recurring:null,
  })));
  localStorage.removeItem('td.tasks'); localStorage.removeItem('td.roles');
  S.pendingImport = null;
  await loadData();
}

function skipImport() {
  $('importDlg').close();
  localStorage.removeItem('td.tasks'); localStorage.removeItem('td.roles');
}

// ── THEME ──
const applyTheme = t => { document.documentElement.classList.toggle('dark', t==='dark'); lsSet('td.theme', t); };
function toggleTheme() {
  applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
  const isDark = document.documentElement.classList.contains('dark');
  const btn = $('darkToggleBtn');
  if (btn) {
    btn.style.background = isDark ? '#171717' : '#d4d4d8';
    const knob = btn.querySelector('span');
    if (knob) knob.style.transform = `translateX(${isDark ? '1.375rem' : '0.25rem'})`;
  }
}

// ── NAV ──
function navTo(page) {
  S.page = page;
  document.querySelectorAll('.nav-s,.nav-b').forEach(b => {
    const on = b.dataset.nav === page;
    if (b.classList.contains('nav-s'))
      b.className = `nav-s w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-right transition ${on ? 'bg-neutral-100 dark:bg-neutral-800 font-medium text-neutral-900 dark:text-neutral-100' : 'text-neutral-600 dark:text-neutral-400 hover:bg-neutral-50 dark:hover:bg-neutral-800/50'}`;
    else
      b.className = `nav-b flex-1 flex flex-col items-center gap-0.5 py-2.5 text-xs transition ${on ? 'text-neutral-900 dark:text-neutral-100 font-semibold' : 'text-neutral-500 dark:text-neutral-400'}`;
  });
  $('fab').classList.toggle('hidden', page !== 'tasks');
  render();
}

// ── TASK CARD ──
function taskCard(t, hideDate=false) {
  const color = roleColor(t.role_id), name = roleName(t.role_id);
  const overdue = !t.done && new Date(t.due) < dayStart(new Date());
  const tags = Array.isArray(t.tags) ? t.tags.filter(Boolean) : [];
  const recurIcon = t.recurring ? ' 🔁' : '';
  return `<div class="flex items-start gap-3 rounded-xl border bg-white dark:bg-neutral-900 p-3 shadow-sm active:opacity-80 transition"
    style="border-inline-start:3px solid ${color}">
    <input type="checkbox" data-toggle="${t.id}" ${t.done?'checked':''}
      class="mt-1 h-4 w-4 shrink-0 rounded border-neutral-300 dark:border-neutral-600 cursor-pointer"
      onclick="event.stopPropagation()">
    <button data-edit="${t.id}" class="min-w-0 flex-1 text-start">
      <span class="text-base font-medium ${t.done?'line-through text-neutral-400 dark:text-neutral-500':''}">${esc(t.title)}${recurIcon}</span>
      <div class="mt-1 flex flex-wrap items-center gap-1.5">
        ${name ? `<span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" style="background:${color}1f;color:${color}">${esc(name)}</span>` : ''}
        ${t.priority==='high'&&!t.done ? `<span class="text-xs font-medium text-red-500">🔴 גבוהה</span>` : ''}
        ${tags.map(g=>`<span class="rounded-full border border-neutral-200 dark:border-neutral-700 px-1.5 py-0.5 text-xs text-neutral-500 dark:text-neutral-400">${esc(g)}</span>`).join('')}
        ${!hideDate ? `<span class="text-xs ${overdue?'text-red-500 font-medium':'text-neutral-400 dark:text-neutral-500'}">${overdue?'⏰ ':''}${fmtDate(t.due)}, ${fmtTime(t.due)}</span>` : `<span class="text-xs text-neutral-400">${fmtTime(t.due)}</span>`}
      </div>
    </button>
  </div>`;
}

function section(icon, title, tasks, hideDate=false, empty=null) {
  if (!tasks.length && empty===null) return '';
  return `<section class="mb-5">
    <h2 class="text-xs font-semibold uppercase tracking-widest text-neutral-500 dark:text-neutral-400 mb-2">${icon} ${title}</h2>
    ${tasks.length
      ? `<div class="space-y-2">${tasks.map(t=>taskCard(t,hideDate)).join('')}</div>`
      : `<p class="text-sm text-neutral-400 dark:text-neutral-500 py-3 text-center">${empty}</p>`}
  </section>`;
}

// ── PAGES ──
function render() {
  if (S.page === 'tasks') renderTasks();
  else if (S.page === 'calendar') renderCalendar();
  else renderAccount();
}

function renderTasks() {
  const now = new Date(), today = dayStart(now);
  const tmrw = addDays(today,1), dayAfter = addDays(today,2), weekEnd = addDays(today,8);
  const all = S.tasks.filter(t => !S.roleFilter || t.role_id === S.roleFilter);
  const pend = all.filter(t=>!t.done), done = all.filter(t=>t.done);
  const overdue   = pend.filter(t=>new Date(t.due)<today);
  const todayT    = pend.filter(t=>{ const d=new Date(t.due); return d>=today&&d<tmrw; });
  const tomorrowT = pend.filter(t=>{ const d=new Date(t.due); return d>=tmrw&&d<dayAfter; });
  const impWeek   = pend.filter(t=>{ const d=new Date(t.due); return t.priority==='high'&&d>=dayAfter&&d<weekEnd; });
  const rest      = pend.filter(t=>{ const d=new Date(t.due); return d>=dayAfter&&!(t.priority==='high'&&d<weekEnd); });
  const lateCount = overdue.length;

  $('pageHeader').innerHTML = `
    <div class="flex-1 min-w-0">
      <h1 class="text-base font-semibold">משימות</h1>
      <p class="text-xs text-neutral-500">${pend.length} פתוחות${lateCount?` · ${lateCount} באיחור`:''}</p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button onclick="openTaskDlg(null)" class="hidden md:flex btn-primary items-center gap-1">+ משימה חדשה</button>
      <button onclick="toggleTheme()" class="rounded-lg border border-neutral-200 dark:border-neutral-800 px-2.5 py-1.5 text-sm">
        <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
      </button>
    </div>`;

  const chips = S.roles.length ? `<div class="flex flex-wrap gap-2 mb-4">
    <button data-rf="" class="rounded-full border px-3 py-1 text-sm transition ${!S.roleFilter?'bg-neutral-900 text-white dark:bg-white dark:text-neutral-900 border-neutral-900':'border-neutral-300 dark:border-neutral-700 text-neutral-500'}">הכל</button>
    ${S.roles.map(r=>`<button data-rf="${r.id}" class="rounded-full border px-3 py-1 text-sm transition"
      style="${S.roleFilter===r.id?`border-color:${r.color};background:${r.color}1f;color:${r.color}`:'border-color:#d4d4d8;color:#a1a1aa'}">${esc(r.name)}</button>`).join('')}
  </div>` : '';

  if (!S.tasks.length) {
    $('pageContent').innerHTML = chips + `<div class="text-center py-16">
      <p class="text-5xl mb-3">📋</p>
      <p class="font-medium mb-1 text-neutral-700 dark:text-neutral-300">עדיין אין משימות</p>
      <p class="text-sm text-neutral-400 dark:text-neutral-500 mb-5">הוסף את המשימה הראשונה שלך</p>
      <button onclick="openTaskDlg(null)" class="btn-primary">+ משימה חדשה</button>
    </div>`;
    return;
  }

  const doneHtml = S.showDone && done.length ? section('✅','הושלמו', done.slice(0,20)) : '';
  $('pageContent').innerHTML = chips +
    section('⏰','באיחור', overdue) +
    section('📅','היום', todayT, true, '🎉 אין משימות להיום') +
    section('🌅','מחר', tomorrowT) +
    section('⭐','חשובות השבוע', impWeek) +
    section('📂','עוד משימות', rest) +
    (!pend.length&&!overdue.length ? `<div class="text-center py-16"><p class="text-5xl mb-3">🎉</p><p class="text-neutral-500">כל המשימות הושלמו!</p></div>` : '') +
    (done.length ? `<button onclick="toggleShowDone()" class="text-sm text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 w-full text-center py-3 mt-2">
      ${S.showDone?'🔼 הסתר':'🔽 הצג '+done.length+' שהושלמו'}</button>` : '') +
    doneHtml;
}

function toggleShowDone() { S.showDone = !S.showDone; renderTasks(); }

function renderCalendar() {
  const grid = monthGrid(S.calAnchor), month = S.calAnchor.getMonth();
  const lbl = S.calAnchor.toLocaleDateString(HE, {month:'long', year:'numeric'});
  $('pageHeader').innerHTML = `
    <h1 class="text-base font-semibold flex-1">${lbl}</h1>
    <div class="flex items-center gap-1">
      <button data-cal="-1" class="rounded-lg border border-neutral-200 dark:border-neutral-800 px-2.5 py-1.5 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-800">&lsaquo;</button>
      <button data-cal="0"  class="rounded-lg border border-neutral-200 dark:border-neutral-800 px-2 py-1 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-800">היום</button>
      <button data-cal="1"  class="rounded-lg border border-neutral-200 dark:border-neutral-800 px-2.5 py-1.5 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-800">&rsaquo;</button>
    </div>`;
  const head = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  $('pageContent').innerHTML = `<div class="overflow-hidden rounded-xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900">
    <div class="grid grid-cols-7 border-b border-neutral-200 dark:border-neutral-800 text-center text-xs font-medium text-neutral-500 dark:text-neutral-400">
      ${head.map(h=>`<div class="py-2">${h}</div>`).join('')}
    </div>
    <div class="grid grid-cols-7">
      ${grid.map((d,i)=>{
        const list = S.tasks.filter(t=>!t.done&&sameDay(new Date(t.due),d));
        const isToday = sameDay(d,new Date());
        return `<div class="min-h-[5rem] border-neutral-200 dark:border-neutral-800 p-1 ${i%7?'border-s':''} ${i>=7?'border-t':''} ${d.getMonth()===month?'':'bg-neutral-50/40 dark:bg-neutral-950/40'}">
          <div class="text-xs tabular-nums mb-0.5 ${isToday?'inline-flex h-5 w-5 items-center justify-center rounded-full bg-neutral-900 text-white dark:bg-white dark:text-neutral-900 font-bold':'text-neutral-400'}">${d.getDate()}</div>
          ${list.slice(0,3).map(t=>`<button data-edit="${t.id}" class="block w-full truncate rounded px-1 py-0.5 text-xs text-start mb-0.5 hover:opacity-80"
            style="background:${roleColor(t.role_id)}1f;color:${roleColor(t.role_id)}">${fmtTime(t.due)} ${esc(t.title)}</button>`).join('')}
          ${list.length>3?`<button onclick="navTo('tasks')" class="text-xs text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 px-1">+${list.length-3}</button>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderAccount() {
  const user = S.user;
  const dn = user?.user_metadata?.display_name || user?.email?.split('@')[0] || '';
  const isDark = document.documentElement.classList.contains('dark');
  $('pageHeader').innerHTML = `<h1 class="text-base font-semibold flex-1">חשבון</h1>
    <button onclick="signOut()" class="btn-ghost text-sm">↩ התנתקות</button>`;
  $('pageContent').innerHTML = `
    <section class="card p-4 mb-4">
      <h2 class="text-sm font-semibold mb-3">👤 פרופיל</h2>
      <div class="space-y-2 text-sm">
        <div>
          <label class="label">שם לתצוגה</label>
          <div class="flex gap-2">
            <input id="dnInput" value="${esc(dn)}" maxlength="40" class="input flex-1">
            <button onclick="updateDisplayName()" class="btn-primary py-1.5 px-3 text-xs whitespace-nowrap">עדכן</button>
          </div>
        </div>
        <p class="text-neutral-500 dark:text-neutral-400 text-xs">אימייל: <span class="text-neutral-900 dark:text-neutral-100">${esc(user?.email||'')}</span></p>
      </div>
    </section>

    <section class="card p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold">🏷️ תפקידים</h2>
        <button onclick="openRoleDlg(null)" class="text-xs font-medium text-neutral-900 dark:text-neutral-100 hover:underline">+ הוסף</button>
      </div>
      ${S.roles.length ? S.roles.map(r=>`
        <div class="flex items-center gap-3 py-2.5 border-b border-neutral-100 dark:border-neutral-800 last:border-0">
          <span class="h-4 w-4 rounded-full shrink-0" style="background:${r.color}"></span>
          <span class="flex-1 text-sm">${esc(r.name)}</span>
          <span class="text-xs text-neutral-400">${S.tasks.filter(t=>t.role_id===r.id&&!t.done).length} פתוחות</span>
          <button data-er="${r.id}" class="text-xs btn-ghost py-1 px-2">ערוך</button>
        </div>`).join('')
        : '<p class="text-sm text-neutral-400 py-2 text-center">אין תפקידים עדיין.</p>'}
    </section>

    <section class="card p-4 mb-4">
      <h2 class="text-sm font-semibold mb-3">📧 דוח יומי במייל</h2>
      <form id="emailForm" onsubmit="saveEmailSettings(event)" class="space-y-3">
        <div>
          <label class="label">שלח לאימייל</label>
          <input name="email" type="email" value="${esc(user?.email||'')}" class="input w-full">
        </div>
        <div>
          <label class="label">שעת שליחה</label>
          <select name="hour" id="rHour" class="input w-full">
            ${Array.from({length:24},(_,h)=>`<option value="${h}" ${h===7?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}
          </select>
        </div>
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="checkbox" name="enabled" id="rEnabled" checked class="h-4 w-4 rounded"> פעיל
        </label>
        <button type="submit" class="btn-primary">שמור הגדרות</button>
      </form>
    </section>

    <section class="card p-4 mb-4">
      <h2 class="text-sm font-semibold mb-3">🎨 מראה</h2>
      <div class="flex items-center justify-between">
        <span class="text-sm">מצב כהה</span>
        <button dir="ltr" type="button" id="darkToggleBtn" onclick="toggleTheme()" aria-label="מצב כהה"
          class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-400"
          style="background:${isDark?'#171717':'#d4d4d8'}">
          <span class="inline-block h-4 w-4 rounded-full bg-white shadow-sm transition-transform duration-200"
            style="transform:translateX(${isDark?'1.375rem':'0.25rem'})"></span>
        </button>
      </div>
    </section>`;
  loadEmailSettings();
}

async function updateDisplayName() {
  const val = $('dnInput')?.value.trim();
  if (!val) return;
  const { error } = await sb.auth.updateUser({ data: { display_name: val } });
  if (error) { toast('שגיאה בעדכון השם', 'err'); return; }
  const su = $('sideUser'); if (su) su.textContent = val;
  toast('שם עודכן ✓');
}

async function loadEmailSettings() {
  const { data } = await sb.from('email_report_settings').select('*').eq('user_id', S.user.id).maybeSingle();
  if (!data) return;
  const f = $('emailForm'); if (!f) return;
  f.email.value = data.email;
  $('rHour').value = data.send_hour;
  $('rEnabled').checked = data.enabled;
}

async function saveEmailSettings(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const { error } = await sb.from('email_report_settings').upsert({
    user_id: S.user.id, email: f.get('email'),
    send_hour: parseInt(f.get('hour')), enabled: !!f.get('enabled'),
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    updated_at: new Date().toISOString(),
  });
  if (error) toast('שגיאה בשמירה', 'err');
  else toast('✅ הגדרות נשמרו');
}

// ── TASK MODAL ──
let _delTaskTimer = null;

function openTaskDlg(task) {
  S.editTask = task || null;
  $('taskDlgTitle').textContent = task ? 'ערוך משימה' : 'משימה חדשה';
  const delBtn = $('taskDelBtn');
  delBtn.classList.toggle('hidden', !task);
  delBtn.textContent = 'מחק'; delete delBtn.dataset.confirming; clearTimeout(_delTaskTimer);
  $('roleSelect').innerHTML = `<option value="">ללא תפקיד</option>` +
    S.roles.map(r=>`<option value="${r.id}" ${task?.role_id===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
  const f = $('taskForm'); f.reset();
  $('customDays').classList.add('hidden');
  if (task) {
    f.title.value = task.title; f.desc.value = task.description || '';
    f.due.value = task.due ? task.due.slice(0,16) : '';
    f.priority.value = task.priority;
    f.tags.value = Array.isArray(task.tags) ? task.tags.join(', ') : '';
    if (task.recurring?.startsWith('days:')) {
      $('recurSelect').value = 'custom'; $('customDays').classList.remove('hidden');
      task.recurring.slice(5).split(',').forEach(d => { const cb = f.querySelector(`[name=rd${d}]`); if (cb) cb.checked = true; });
    } else { $('recurSelect').value = task.recurring || ''; }
  } else {
    const d = new Date(); d.setMinutes(0,0,0); d.setHours(d.getHours()+1);
    f.due.value = new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  }
  $('taskDlg').showModal(); f.title.focus();
}

function onRecurChange(v) { $('customDays').classList.toggle('hidden', v!=='custom'); }

async function handleSaveTask(e) {
  e.preventDefault();
  const btn = $('taskSaveBtn');
  btn.disabled = true; btn.textContent = 'שומר...';
  try {
    const f = new FormData(e.target);
    let recurring = f.get('recurring') || null;
    if (recurring === 'custom') {
      const days = [0,1,2,3,4,5,6].filter(i=>f.get(`rd${i}`));
      recurring = days.length ? `days:${days.join(',')}` : null;
    }
    await upsertTask({
      id: S.editTask?.id,
      title: f.get('title').trim(), description: f.get('desc').trim(),
      role_id: f.get('role') || null, due: f.get('due'),
      priority: f.get('priority'), done: S.editTask?.done || false,
      tags: (f.get('tags')||'').split(',').map(s=>s.trim()).filter(Boolean),
      recurring,
    });
    $('taskDlg').close();
  } catch {
    toast('שגיאה בשמירה', 'err');
    btn.disabled = false; btn.textContent = 'שמור';
  }
}

async function handleDeleteTask() {
  if (!S.editTask) return;
  const btn = $('taskDelBtn');
  if (!btn.dataset.confirming) {
    btn.dataset.confirming = '1';
    btn.textContent = '⚠️ בטוח?';
    _delTaskTimer = setTimeout(() => { delete btn.dataset.confirming; btn.textContent = 'מחק'; }, 3000);
    return;
  }
  clearTimeout(_delTaskTimer);
  await deleteTask(S.editTask.id);
  $('taskDlg').close();
}

// ── ROLE MODAL ──
let _delRoleTimer = null;

function openRoleDlg(role) {
  S.editRole = role || null;
  $('roleDlgTitle').textContent = role ? 'ערוך תפקיד' : 'תפקיד חדש';
  const delBtn = $('roleDelBtn');
  delBtn.classList.toggle('hidden', !role);
  delBtn.textContent = 'מחק'; delete delBtn.dataset.confirming; clearTimeout(_delRoleTimer);
  const f = $('roleForm'); f.reset();
  if (role) { f.name.value = role.name; $('colorPicker').value = role.color; }
  else { $('colorPicker').value = PALETTE[S.roles.length % PALETTE.length]; }
  $('colorSwatches').innerHTML = PALETTE.map(c=>`<button type="button" data-swatch="${c}"
    class="h-7 w-7 rounded-full border-2 transition hover:scale-110"
    style="background:${c};border-color:${$('colorPicker').value===c?'#000':'transparent'}" onclick="pickSwatch('${c}')"></button>`).join('');
  $('roleDlg').showModal(); f.name.focus();
}

function pickSwatch(c) {
  $('colorPicker').value = c;
  document.querySelectorAll('[data-swatch]').forEach(b => { b.style.borderColor = b.dataset.swatch===c ? '#000' : 'transparent'; });
}

$('colorPicker') && $('colorPicker').addEventListener('input', e => pickSwatch(e.target.value));

async function handleSaveRole(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  await upsertRole(f.get('name').trim(), $('colorPicker').value, S.editRole?.id);
  $('roleDlg').close();
}

async function handleDeleteRole() {
  if (!S.editRole) return;
  const btn = $('roleDelBtn');
  if (!btn.dataset.confirming) {
    btn.dataset.confirming = '1';
    btn.textContent = '⚠️ בטוח?';
    _delRoleTimer = setTimeout(() => { delete btn.dataset.confirming; btn.textContent = 'מחק'; }, 3000);
    return;
  }
  clearTimeout(_delRoleTimer);
  await deleteRole(S.editRole.id);
  $('roleDlg').close();
}

// ── GLOBAL CLICKS ──
document.addEventListener('click', e => {
  const b = e.target.closest('[data-nav],[data-toggle],[data-edit],[data-rf],[data-cal],[data-er]');
  if (!b) return;
  if (b.dataset.nav)    { navTo(b.dataset.nav); return; }
  if (b.dataset.toggle) { const t=S.tasks.find(x=>x.id===b.dataset.toggle); if(t) toggleTask(t); return; }
  if (b.dataset.edit)   { const t=S.tasks.find(x=>x.id===b.dataset.edit);   if(t) openTaskDlg(t); return; }
  if ('rf' in b.dataset) { S.roleFilter = b.dataset.rf || null; renderTasks(); return; }
  if (b.dataset.cal !== undefined) {
    const n=+b.dataset.cal;
    if(n===0) S.calAnchor=new Date();
    else S.calAnchor=new Date(S.calAnchor.getFullYear(), S.calAnchor.getMonth()+n, 1);
    renderCalendar(); return;
  }
  if (b.dataset.er) { const r=S.roles.find(x=>x.id===b.dataset.er); if(r) openRoleDlg(r); return; }
});

// ── REALTIME ──
function setupRealtime() {
  sb.channel('task-sync')
    .on('postgres_changes', {event:'*',schema:'public',table:'tasks',     filter:`user_id=eq.${S.user.id}`}, () => loadData())
    .on('postgres_changes', {event:'*',schema:'public',table:'task_roles',filter:`user_id=eq.${S.user.id}`}, () => loadData())
    .subscribe();
}

// ── INIT ──
applyTheme(lsGet('td.theme', matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
setAuthMode('login');

sb.auth.onAuthStateChange(async (event, session) => {
  S.user = session?.user || null;
  if (S.user) {
    const dn = S.user.user_metadata?.display_name || S.user.email;
    const su = $('sideUser'); if (su) su.textContent = dn;
    await loadData();
    setupRealtime();
    checkImport();
    $('authScreen').classList.add('hidden');
    $('appRoot').classList.remove('hidden');
    navTo('tasks');
  } else {
    $('authScreen').classList.remove('hidden');
    $('appRoot').classList.add('hidden');
  }
});
</script>
</body>
</html>
